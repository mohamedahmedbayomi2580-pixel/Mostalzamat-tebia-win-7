name: Build Windows 7

on:
  push:
    paths:
      - "win7/**"
      - ".github/workflows/build-win7.yml"
  workflow_dispatch:

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: win7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Cashier-Windows7
          path: win7/dist/*.exe
