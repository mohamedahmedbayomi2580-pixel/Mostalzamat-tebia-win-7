name: Build Windows 7

on:
  push:
    paths:
      - "win7/**"
      - ".github/workflows/build-win7.yml"
  workflow_dispatch:
666
env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: win7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm run build
      - name: Verify SQLite native module
        shell: pwsh
        continue-on-error: true
        run: |
          $f = Get-ChildItem -Path dist -Recurse -Filter better_sqlite3.node -ErrorAction SilentlyContinue
          if (-not $f) { Write-Host "::warning::SQLite native module NOT found. The app will use file storage instead of SQLite"; exit 1 }
          $f | ForEach-Object { Write-Host "SQLite OK: $($_.FullName)" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cashier-Windows7
          path: win7/dist/*.exe
