function h53(s){let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return 4294967296*(2097151&b)+(a>>>0)}
const DAY=864e5,TRIAL=7*DAY,CODE=8517982236842995
// تخزين بيانات البرنامج في IndexedDB (مساحة الجهاز) مع إبقاء localStorage كنسخة توافقية صغيرة.
const idb=(k,v)=>new Promise(r=>{try{const q=indexedDB.open('pk',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onerror=()=>r(null);q.onsuccess=()=>{const t=q.result.transaction('s',v===undefined?'readonly':'readwrite'),o=t.objectStore('s');if(v===undefined){const g=o.get(k);g.onsuccess=()=>r(g.result);g.onerror=()=>r(null)}else{o.put(v,k);t.oncomplete=()=>r(v)}}}catch(e){r(null)}})
// التخزين الأساسي في ملف فعلي داخل مجلد باسم نظام الكاشير.
const APP_FOLDER='نظام الكاشير', DATA_FILE='data.json';
async function getFolderHandle(){try{return await idb('folderHandle')}catch(e){return null}}
async function persistToFolder(data){
 const C=window.Capacitor&&window.Capacitor.Plugins;
 if(C&&C.Filesystem){
  const json=JSON.stringify(data), encoded=btoa(unescape(encodeURIComponent(json)));
  await C.Filesystem.mkdir({path:APP_FOLDER,directory:'DOCUMENTS',recursive:true}).catch(()=>{});
  await C.Filesystem.writeFile({path:APP_FOLDER+'/'+DATA_FILE,data:encoded,directory:'DOCUMENTS',encoding:'base64'});
  return true;
 }
 const root=await getFolderHandle();
 if(root){const dir=await root.getDirectoryHandle(APP_FOLDER,{create:true});const fh=await dir.getFileHandle(DATA_FILE,{create:true});const w=await fh.createWritable();await w.write(JSON.stringify(data));await w.close();return true}
 return false;
}
async function loadFromFolder(){
 const C=window.Capacitor&&window.Capacitor.Plugins;
 if(C&&C.Filesystem){try{const x=await C.Filesystem.readFile({path:APP_FOLDER+'/'+DATA_FILE,directory:'DOCUMENTS',encoding:'utf8'});if(x&&x.data)return JSON.parse(x.data)}catch(e){} }
 const root=await getFolderHandle();if(root){try{const dir=await root.getDirectoryHandle(APP_FOLDER);const fh=await dir.getFileHandle(DATA_FILE);return JSON.parse(await (await fh.getFile()).text())}catch(e){}}
 return null;
}
async function chooseDataFolder(){
 if(!window.showDirectoryPicker){alert('اختيار مجلد مباشر غير مدعوم هنا. لو البرنامج داخل APK مدعوم بـ Capacitor فسيحفظ في مجلد المستندات باسم نظام الكاشير.');return}
 try{const root=await window.showDirectoryPicker({mode:'readwrite'});await idb('folderHandle',root);await persistToFolder(S);alert('تم ربط الحفظ بالمجلد: '+APP_FOLDER+' داخل المجلد الذي اخترته.');}
 catch(e){if(e.name!=='AbortError')alert('تعذر اختيار المجلد أو الكتابة فيه.');}
}
const enc=o=>{const p=btoa(JSON.stringify(o));return p+'.'+h53(p+'#k9')},dec=x=>{try{const[p,c]=x.split('.');return h53(p+'#k9')==c?JSON.parse(atob(p)):0}catch(e){return 0}}
async function lic(){const raw=[ls.getItem('_tk'),ls.getItem('_sy'),await idb('k')].filter(Boolean),now=Date.now();let tamper=0,st=now,la=0,ac=0;
raw.forEach(x=>{const o=dec(x);if(!o)tamper=1;else{st=Math.min(st,o.s);la=Math.max(la,o.l);ac=ac||o.a}});
la=Math.max(la,now);const rec={s:st,l:la,a:ac},e=enc(rec);ls.setItem('_tk',e);ls.setItem('_sy',e);await idb('k',e);
const left=TRIAL-(la-st);return{ok:!!ac||(!tamper&&left>0),act:!!ac,days:Math.max(0,Math.ceil(left/DAY)),rec}}
async function boot(){
try{
 const fileData=await loadFromFolder();
 if(fileData&&fileData.p&&fileData.c&&fileData.i){S=fileData;norm();await idb('pos',S)}
 else {
  const stored=await idb('pos');
  if(stored&&stored.p&&stored.c&&stored.i){S=stored;norm();await persistToFolder(S)}
  else {await idb('pos',S);await persistToFolder(S)}
 }
}catch(e){console.warn('تحميل بيانات المجلد:',e)}
document.body.className=S.s.dk?'dk':'';
const r=await lic();
if(r.ok){$('tl').textContent=r.act?'':`| تجربة: متبقي ${r.days} يوم`;setInterval(async()=>{const q=await lic();if(!q.ok)location.reload()},6e4);lock()}else showLic()
}
function showLic(){$('lc')&&$('lc').remove();const d=document.createElement('div');d.id='lc';d.innerHTML=`<div class="ov" style="background:var(--bg);z-index:99"><div class="mo card" style="margin-top:10vh;text-align:center"><h2 class="red">انتهت فترة تفعيل البرنامج</h2><p>انتهت مدة التجربة (7 أيام). للمتابعة أدخل كود التفعيل.</p><input id="lcv" placeholder="ادخل كود التفعيل" style="text-align:center;font-size:16px;direction:ltr"><button class="b" onclick="actv()">تفعيل</button><p id="lce" class="red"></p><a class="b w" style="text-decoration:none;display:inline-block" href="https://wa.me/201020939471" target="_blank" rel="noopener">للحصول على الكود تواصل مع المطور</a></div></div>`;document.body.appendChild(d)}
async function actv(){if(h53($('lcv').value.trim().toLowerCase())!=CODE){$('lce').textContent='كود التفعيل غير صحيح';return}
const o=dec(ls.getItem('_tk'))||{s:Date.now(),l:Date.now()};o.a=1;const e=enc(o);ls.setItem('_tk',e);ls.setItem('_sy',e);await idb('k',e);$('lc').remove();$('tl').textContent='';lock()}
boot()
</script></body></html>
