/* ---------- التخزين: SQLite (أندرويد: Capacitor SQLite / ويندوز: better-sqlite3) ---------- */
const DBM={mode:'ls'},TBS=['p','c','i','r','h','kv'],KY={p:x=>x.id,c:(x,i)=>i,i:x=>x.n,r:x=>x.n,h:(x,i)=>i},DEF={shop:'',tg:'',ph:'',ad:'',lg:'',pw:'',dk:1,nv:1,pm:'inv',ft:'شكراً لتعاملكم معنا',tr:'',ut:['قطعة','علبة','كرتونة','شريط']}
const TBL='CREATE TABLE IF NOT EXISTS p(k INTEGER PRIMARY KEY,j TEXT NOT NULL);CREATE TABLE IF NOT EXISTS c(k INTEGER PRIMARY KEY,j TEXT NOT NULL);CREATE TABLE IF NOT EXISTS i(k INTEGER PRIMARY KEY,j TEXT NOT NULL);CREATE TABLE IF NOT EXISTS r(k INTEGER PRIMARY KEY,j TEXT NOT NULL);CREATE TABLE IF NOT EXISTS h(k INTEGER PRIMARY KEY,j TEXT NOT NULL);CREATE TABLE IF NOT EXISTS kv(k TEXT PRIMARY KEY,j TEXT NOT NULL);'
let LAST={p:new Map(),c:new Map(),i:new Map(),r:new Map(),h:new Map()},LKV={},BUSY=0,AGAIN=0
async function dbInit(){try{
if(window.sqlAPI){DBM.mode=(await sqlAPI.mode())=='sqlite'?'sqlite':'file';DBM.b={load:()=>sqlAPI.load(),apply:o=>sqlAPI.apply(o)};return}
const P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.CapacitorSQLite;
if(P){const database='cashier';try{await P.createConnection({database,version:1,encrypted:false,mode:'no-encryption',readonly:false})}catch(e){}
await P.open({database,readonly:false});await P.execute({database,statements:TBL,transaction:true,readonly:false});DBM.mode='sqlite';
DBM.b={load:async()=>{const o={};for(const t of TBS){const r=await P.query({database,statement:`SELECT k,j FROM ${t} ORDER BY k`,values:[],readonly:false});o[t]=(r.values||[]).filter(x=>x.j!=null)}return o},
apply:o=>P.executeSet({database,set:o.map(x=>x.d?{statement:`DELETE FROM ${x.t} WHERE k=?`,values:[x.k]}:{statement:`INSERT OR REPLACE INTO ${x.t}(k,j) VALUES(?,?)`,values:[x.k,x.j]}),transaction:true,readonly:false,returnMode:'no'})};return}
}catch(e){console.log('db init',e)}DBM.mode='ls'}
function snap(){const ops=[],nl={};for(const t of['p','c','i','r','h']){const cur=new Map();S[t].forEach((x,i)=>cur.set(KY[t](x,i),JSON.stringify(x)));LAST[t].forEach((_,k)=>{if(!cur.has(k))ops.push({t,k,d:1})});cur.forEach((j,k)=>{if(LAST[t].get(k)!==j)ops.push({t,k,j})});nl[t]=cur}
const kv={n:String(S.n),s:JSON.stringify(S.s),log:JSON.stringify(S.log)};for(const k in kv)if(LKV[k]!==kv[k])ops.push({t:'kv',k,j:kv[k]});return{ops,commit:()=>{LAST=nl;LKV=kv}}}
async function flush(){if(BUSY){AGAIN=1;return false}BUSY=1;let ok=true;try{const d=snap();for(let i=0;i<d.ops.length;i+=400)await DBM.b.apply(d.ops.slice(i,i+400));d.commit()}catch(e){ok=false;console.log('db save',e);toast('⚠ تعذر حفظ البيانات في قاعدة البيانات')}BUSY=0;if(AGAIN){AGAIN=0;flush()}return ok}

async function dbLoad(){if(DBM.mode=='ls')return;const o=await DBM.b.load(),rows=t=>(o[t]||[]).map(r=>JSON.parse(r.j)),kv={};(o.kv||[]).forEach(r=>kv[r.k]=r.j);
if(!(o.p||[]).length&&!(o.i||[]).length&&!(o.c||[]).length&&!kv.s){if(ls.pos){try{S=JSON.parse(ls.pos);S.s=Object.assign({},DEF,S.s);norm();if(await flush())ls.removeItem('pos')}catch(e){console.log('migrate',e)}}return}
S={p:rows('p'),c:rows('c'),i:rows('i'),r:rows('r'),h:rows('h'),n:+kv.n||1,s:Object.assign({},DEF,JSON.parse(kv.s||'{}')),log:JSON.parse(kv.log||'[]')};norm();
for(const t of['p','c','i','r','h']){LAST[t]=new Map();S[t].forEach((x,i)=>LAST[t].set(KY[t](x,i),JSON.stringify(x)))}LKV={n:String(S.n),s:JSON.stringify(S.s),log:JSON.stringify(S.log)}}

function h53(s){let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return 4294967296*(2097151&b)+(a>>>0)}
const DAY=864e5,TRIAL=5*DAY,CODE=8517982236842995
const idb=(k,v)=>new Promise(r=>{try{const q=indexedDB.open('pk',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onerror=()=>r(null);q.onsuccess=()=>{const t=q.result.transaction('s',v===undefined?'readonly':'readwrite'),o=t.objectStore('s');if(v===undefined){const g=o.get(k);g.onsuccess=()=>r(g.result);g.onerror=()=>r(null)}else{o.put(v,k);t.oncomplete=()=>r(v)}}}catch(e){r(null)}})
const enc=o=>{const p=btoa(JSON.stringify(o));return p+'.'+h53(p+'#k9')},dec=x=>{try{const[p,c]=x.split('.');return h53(p+'#k9')==c?JSON.parse(atob(p)):0}catch(e){return 0}}
async function lic(){const raw=[ls.getItem('_tk'),ls.getItem('_sy'),await idb('k')].filter(Boolean),now=Date.now();let tamper=0,st=now,la=0,ac=0;

la=Math.max(la,now);const rec={s:st,l:la,a:ac},e=enc(rec);ls.setItem('_tk',e);ls.setItem('_sy',e);await idb('k',e);
const left=TRIAL-(la-st);return{ok:!!ac||(!tamper&&left>0),act:!!ac,days:Math.max(0,Math.ceil(left/DAY)),rec}}
